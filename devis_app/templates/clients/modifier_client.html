{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un Client</title>
    
    <!-- Apply theme immediately to prevent flash -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme-preference') || 
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Theme CSS -->
    <link href="{% static 'css/theme.css' %}?v=5" rel="stylesheet">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px var(--shadow);
        }
        h2 {
            text-align: center;
            color: var(--text-color);
        }
        label {
            font-weight: bold;
            color: var(--text-color);
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
    
    <!-- Theme Toggle JS - Inline -->
    <script>
        (function() {
            'use strict';
            const ThemeManager = {
                STORAGE_KEY: 'theme-preference',
                THEME_DARK: 'dark',
                THEME_LIGHT: 'light',
                getPreferredTheme() {
                    const storedTheme = localStorage.getItem(this.STORAGE_KEY);
                    if (storedTheme) return storedTheme;
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? this.THEME_DARK : this.THEME_LIGHT;
                },
                setTheme(theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem(this.STORAGE_KEY, theme);
                    this.updateIcon(theme);
                },
                updateIcon(theme) {
                    const toggleBtn = document.getElementById('theme-toggle');
                    if (!toggleBtn) return;
                    const icon = toggleBtn.querySelector('i');
                    if (!icon) return;
                    if (theme === this.THEME_DARK) {
                        icon.className = 'bi bi-sun-fill';
                        toggleBtn.setAttribute('aria-label', 'Passer au thème clair');
                    } else {
                        icon.className = 'bi bi-moon-fill';
                        toggleBtn.setAttribute('aria-label', 'Passer au thème sombre');
                    }
                },
                toggleTheme() {
                    const currentTheme = document.documentElement.getAttribute('data-theme') || this.getPreferredTheme();
                    const newTheme = currentTheme === this.THEME_DARK ? this.THEME_LIGHT : this.THEME_DARK;
                    this.setTheme(newTheme);
                },
                init() {
                    const theme = this.getPreferredTheme();
                    this.setTheme(theme);
                    const toggleBtn = document.getElementById('theme-toggle');
                    if (toggleBtn) {
                        toggleBtn.addEventListener('click', () => this.toggleTheme());
                    }
                }
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => ThemeManager.init());
            } else {
                ThemeManager.init();
            }
        })();
    </script>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Changer de thème">
        <i class="bi bi-moon-fill"></i>
    </button>
    
    <div class="container">
        <h2>Modifier Client</h2>
        <form method="POST" action="{% url 'modifier_client' slug=client.slug %}">
            {% csrf_token %}
            <!-- ID caché pour identifier le client à modifier -->
            <input type="hidden" name="id" value="{{ client.id }}">
            
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" value="{{ client.nom }}" required>
            
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" value="{{ client.prenom }}" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ client.email }}" required>
            
            <label for="telephone">Téléphone</label>
            <input type="text" id="telephone" name="telephone" value="{{ client.telephone }}">

            <label for="adresse">Adresse</label>
            <input type="text" id="adresse" name="adresse" value="{{ client.adresse }}">

            
            <button type="submit">Enregistrer les modifications</button>
        </form>
    </div>
</body>
</html>

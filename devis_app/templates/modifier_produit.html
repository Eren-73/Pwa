{% extends "base.html" %}

{% block title %}Modifier Produit{% endblock %}

{% block content %}
<h1>Modifier le produit : {{ produit.nom }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'liste_materiels' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(13,110,253,0.10);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }
        .login-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #343a40, #0d6efd);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.8rem; color: #fff;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo"><i class="bi bi-person-lock"></i></div>
    <h4 class="text-center fw-bold mb-1">Connexion</h4>
    <p class="text-center text-muted mb-4" style="font-size:0.9rem;">Accédez à votre espace</p>

    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger py-2 mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>{{ message }}
        </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" id="username" class="form-control" placeholder="Votre identifiant" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" placeholder="Votre mot de passe" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>
    </form>
</div>
</body>
</html>

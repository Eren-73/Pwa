{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
  <h2>Ajouter un point de vente</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Enregistrer</button>
    <a class="btn btn-secondary" href="{% url 'liste_point_ventes' %}">Annuler</a>
  </form>
</div>
{% endblock %}

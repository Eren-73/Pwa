<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Modifier Client</h2>
        <form method="POST" action="{% url 'modifier_client' client.id %}">
            {% csrf_token %}
            <!-- ID caché pour identifier le client à modifier -->
            <input type="hidden" name="id" value="{{ client.id }}">
            
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" value="{{ client.nom }}" required>
            
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" value="{{ client.prenom }}" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ client.email }}" required>
            
            <label for="telephone">Téléphone</label>
            <input type="text" id="telephone" name="telephone" value="{{ client.telephone }}">

            <label for="adresse">Adresse</label>
            <input type="text" id="adresse" name="adresse" value="{{ client.adresse }}">

            
            <button type="submit">Enregistrer les modifications</button>
        </form>
    </div>
</body>
</html>

{% extends "base.html" %}
{% block content %}
<h2>Liste des Clients</h2>
<a href="{% url 'add_client' %}" class="btn btn-primary">+ Ajouter un client</a>

<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Adresse</th>
        </tr>
    </thead>
    <tbody>
        {% for client in clients %}
        <tr>
            <td>{{ client.nom }}</td>
            <td>{{ client.email }}</td>
            <td>{{ client.telephone }}</td>
            <td>{{ client.adresse }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Aucun client enregistré.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

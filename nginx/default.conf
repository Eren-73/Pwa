# d:\Freelance\Python_Dev\Pwa\nginx\default.conf
# Configure Nginx pour servir statics/media et proxifier Django.
# Permet un point d'entrée HTTP unique pour le réseau entreprise.
# RELEVANT FILES:docker-compose.yml, Dockerfile, Devis/settings.py

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
